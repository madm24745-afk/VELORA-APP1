<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VELORA APP — แอปออมเงิน</title>
  <link rel="manifest" href="manifest.json">
  <link "D:\wed\VELORA_APP\VELORA_APP\VELORA_APP\icons\aaa\VELORA_APP\icons\ChatGPT Image Feb 3, 2026, 09_07_32 PM.png">
  <meta name="theme-color" content="#d4af37">
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <style>
    :root{
      --bg:#0f0b08;
      --card:#1a1614;
      --gold:#d4af37;
      --muted:#c9b894;
      --accent:#b8872f;
      --glass: rgba(255,255,255,0.03);
      --success:#4caf50;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b0b0c 0%, #12100f 100%);color:#f7f5f2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .app{width:100%;max-width:980px}
    header{display:flex;gap:16px;align-items:center;margin-bottom:18px}
    .brand{background:linear-gradient(90deg,var(--gold),#f7e7b2);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;font-size:20px}
    .subtitle{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,0.6);border:1px solid rgba(212,175,55,0.06)}
    form .row{display:flex;gap:8px;margin-bottom:8px}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    input[type=text], input[type=date], input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);background:transparent;color:inherit}
    button{background:var(--gold);border:none;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer;color:#1b1206}
    .secondary{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .summary{display:flex;flex-direction:column;gap:12px}
    .stat{display:flex;justify-content:space-between;align-items:center}
    .big{font-size:28px;font-weight:700;color:var(--gold)}
    .muted{color:var(--muted)}
    .progress-wrap{background:var(--glass);border-radius:10px;padding:8px}
    .progress{height:18px;background:rgba(255,255,255,0.04);border-radius:8px;overflow:hidden}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));width:0%;transition:width 0.6s ease}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:14px}
    th{color:var(--muted);font-weight:700}
    .entries{max-height:280px;overflow:auto}
    footer{margin-top:12px;color:var(--muted);font-size:13px}
    /* Splash */
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0b0b0c 0%,#0f0b08 100%);z-index:9999;flex-direction:column;transition:opacity 0.8s ease}
    #splash.hidden{opacity:0;pointer-events:none}
    .splash-inner{text-align:center;animation:fadeIn 1s ease}
    .splash-inner .logo{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d4af37 0%, #b8872f 100%)}
    .splash-inner .logo img{width:72px;height:72px}
    .splash-inner .brand-name{font-size:22px;background:linear-gradient(90deg,var(--gold),#f7e7b2);-webkit-background-clip:text;color:transparent;font-weight:700}
    .loading{font-size:14px;color:var(--muted);margin-top:6px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (max-width:900px){.grid{grid-template-columns:1fr;}.brand{font-size:18px}}
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div ><img src="D:\wed\VELORA_APP\VELORA_APP\VELORA_APP\icons\aaa\VELORA_APP\icons\ChatGPT Image Feb 3, 2026, 09_07_32 PM.png" alt="VELORA"></div>
      <div class="brand-name">VELORA APP</div>
      <div class="loading">ยินดีต้อนรับกลับมา — พร้อมออมวันนี้ไหม?</div>
    </div>
  </div>

  <div class="app" id="app" aria-hidden="true">
    <header>
      <div>
        <div class="brand">VELORA ออมเงิน</div>
        <div class="subtitle">ใครที่ชอบลืม ใช้ผมนะ ผมมีประโยชน์มาก</div>
      </div>
    </header>

    <div class="grid">
      <!-- Left: main features -->
      <div class="card">
        <h3 style="margin:0 0 12px 0">บันทึกและรายการออม</h3>

        <form id="entryForm">
          <div class="row">
            <div style="flex:1">
              <label for="date">วันที่</label>
              <input id="date" type="date" required />
            </div>
            <div style="width:140px">
              <label for="amount">จำนวน (บาท)</label>
              <input id="amount" type="number" step="0.01" min="0" required />
            </div>
          </div>
          <div style="margin-bottom:8px">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <input id="note" type="text" placeholder="เช่น เงินเดือน/ฝากประจำ/เก็บเหรียญ" />
          </div>

          <div style="display:flex;gap:8px;align-items:center">
            <button type="submit">เพิ่มรายการ</button>
            <button type="button" id="clearAll" class="secondary">ล้างทั้งหมด</button>
            <div style="flex:1"></div>
            <button type="button" id="exportJSON" class="secondary">ส่งออก JSON</button>
          </div>
        </form>

        <div class="entries card" style="margin-top:12px;padding:12px;">
          <table id="entriesTable">
            <thead><tr><th>วันที่</th><th>จำนวน</th><th>หมายเหตุ</th><th></th></tr></thead>
            <tbody id="entriesBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Right: summary -->
      <div>
        <div class="card summary">
          <div>
            <div class="stat"><div class="muted">ยอดรวมที่ออม</div><div id="total" class="big">0 ฿</div></div>
            <div class="stat"><div class="muted">เป้าหมาย</div><div id="goalText" class="muted">ยังไม่ได้ตั้ง</div></div>

            <div style="margin-top:10px">
              <label for="goal">ตั้งเป้าหมาย (บาท)</label>
              <input id="goal" type="number" placeholder="เช่น 10000" />
            </div>
            <div class="progress-wrap" style="margin-top:8px">
              <div class="progress"><i id="progressBar"></i></div>
              <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted)"><span id="progressPct">0%</span><span id="leftToGoal">เหลือ 0 ฿</span></div>
            </div>
          </div>

          <div style="margin-top:14px">
            <canvas id="chart" height="220"></canvas>
          </div>

          <footer>
            <div>กราฟ</div>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Simple Savings App JS
    const LS_KEY = 'velora_entries_v1';
    const LS_GOAL = 'velora_goal_v1';

    const dateInput = document.getElementById('date');
    const amountInput = document.getElementById('amount');
    const noteInput = document.getElementById('note');
    const entryForm = document.getElementById('entryForm');
    const entriesBody = document.getElementById('entriesBody');
    const totalEl = document.getElementById('total');
    const goalInput = document.getElementById('goal');
    const goalText = document.getElementById('goalText');
    const progressBar = document.getElementById('progressBar');
    const progressPct = document.getElementById('progressPct');
    const leftToGoal = document.getElementById('leftToGoal');
    const clearAllBtn = document.getElementById('clearAll');
    const exportBtn = document.getElementById('exportJSON');

    // Chart
    const ctx = document.getElementById('chart').getContext('2d');
    let lineChart;

    // Helpers
    function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
    dateInput.value = todayISO();

    function loadEntries(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }
    function saveEntries(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }

    function loadGoal(){ return Number(localStorage.getItem(LS_GOAL) || 0); }
    function saveGoal(v){ if(v>0) localStorage.setItem(LS_GOAL, String(v)); else localStorage.removeItem(LS_GOAL); }

    function formatMoney(n){ return Number(n).toLocaleString('th-TH', {minimumFractionDigits:0,maximumFractionDigits:2}) + ' ฿'; }

    function render(){
      const entries = loadEntries().sort((a,b)=>a.date.localeCompare(b.date));
      entriesBody.innerHTML = '';
      let total = 0;
      entries.forEach((e, i)=>{
        total += Number(e.amount);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.date}</td><td>${Number(e.amount).toLocaleString()}</td><td>${(e.note||'')}</td><td><button data-i="${i}" class="secondary small">x</button></td>`;
        entriesBody.appendChild(tr);
      });

    totalEl.textContent = formatMoney(total);

    // attach delete handlers
    entriesBody.querySelectorAll('button[data-i]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const idx = Number(btn.getAttribute('data-i'));
        entries.splice(idx,1);
        saveEntries(entries);
        render();
      });
    });

    // goal & progress
    const goal = loadGoal();
    if(goal>0){
      goalText.textContent = formatMoney(goal);
      const pct = Math.min(100, Math.round((total/goal)*100));
      progressBar.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      leftToGoal.textContent = `เหลือ ${formatMoney(Math.max(0, goal - total))}`;
    } else {
      goalText.textContent = 'ยังไม่ได้ตั้ง';
      progressBar.style.width = '0%';
      progressPct.textContent = '0%';
      leftToGoal.textContent = 'เหลือ -';
    }

    // chart: show cumulative by date
    const grouped = {};
    entries.forEach(e=>{ grouped[e.date] = (grouped[e.date]||0) + Number(e.amount); });
    const dates = Object.keys(grouped).sort();
    const cum = [];
    let running = 0;
    dates.forEach(d=>{ running += grouped[d]; cum.push(running); });

    renderChart(dates, cum);
    }

    function renderChart(labels, data){
      if(!lineChart){
        lineChart = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets:[{label:'ยอดออมสะสม (฿)', data, fill:true, tension:0.3, pointRadius:4}] },
          options: {
            responsive:true, maintainAspectRatio:false,
            scales:{ y:{ beginAtZero:true } },
            plugins:{ legend:{display:false} }
          }
        });
      } else {
        lineChart.data.labels = labels;
        lineChart.data.datasets[0].data = data;
        lineChart.update();
      }
    }

    // events
    entryForm.addEventListener('submit', e=>{
      e.preventDefault();
      const date = dateInput.value;
      const amount = parseFloat(amountInput.value || 0);
      const note = noteInput.value.trim();
      if(!date || !amount || amount <= 0) return alert('กรุณากรอกวันที่และจำนวนที่ถูกต้อง');
      const entries = loadEntries();
      entries.push({date,amount,note});
      saveEntries(entries);
      amountInput.value=''; noteInput.value=''; dateInput.value = todayISO();
      render();
    });

    goalInput.addEventListener('change', ()=>{
      const v = Number(goalInput.value || 0);
      if(v>0) saveGoal(v); else saveGoal(0);
      render();
    });

    clearAllBtn.addEventListener('click', ()=>{
      if(confirm('ต้องการลบรายการทั้งหมดจริงหรือไม่?')){
        localStorage.removeItem(LS_KEY);
        render();
      }
    });

    exportBtn.addEventListener('click', ()=>{
      const entries = loadEntries();
      const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'velora_savings_export.json'; a.click(); URL.revokeObjectURL(url);
    });

    // initialize
    (function init(){
      const g = loadGoal(); if(g>0) goalInput.value = g;
      render();
    })();

    // hide splash after load
    window.addEventListener('load',()=>{
      setTimeout(()=>{
        document.getElementById('splash').classList.add('hidden');
        document.getElementById('app').setAttribute('aria-hidden','false');
      }, 900);
    });

    // register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
      .then(()=>console.log('✅ Service Worker registered'))
      .catch(()=>{console.log('Service Worker registration failed')});
    }
  </script>
</body>
</html>
